<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nested (B)</title>
<style>
  body { font: 14px/1.45 system-ui, sans-serif; margin: 0; padding: 12px; border: 4px solid #6a1b9a; }
  .banner { background: #6a1b9a; color: #fff; padding: 8px 10px; border-radius: 6px; }
  .origin { font: 12px ui-monospace, monospace; opacity: .9; }
  iframe { width: 100%; height: 560px; border: 2px dashed #6a1b9a; border-radius: 6px; margin-top: 12px; }
</style>
</head>
<body>
  <div class="banner">
    <strong>NESTED MIDDLE (B)</strong> — embeds a grandchild on origin C
    <div class="origin" id="origin"></div>
  </div>
  <!-- Grandchild lives on the NEXT port (origin C), so #nested > #grandchild is A→B→C. -->
  <iframe id="grandchild" title="grandchild C"></iframe>
<script>
(function () {
  document.getElementById('origin').textContent = location.origin + location.pathname;
  const host = location.protocol + '//' + location.hostname;
  const C = `${host}:${(+location.port) + 1}`;
  document.getElementById('grandchild').src =
    `${C}/frame.html?label=${encodeURIComponent('GRANDCHILD (C)')}&accent=%23ef6c00&phrase=findme-grandchild-c`;
})();
</script>
</body>
</html>
