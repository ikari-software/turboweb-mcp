name: release

# Fires when a release is published from a v* tag. Downloads the pre-built
# artifacts the developer uploaded via `gh release create dist/*`, generates
# an authoritative SHA256SUMS file, signs it with Sigstore keyless OIDC
# (cosign — no long-lived key material), and uploads the signature bundle
# back to the release.
#
# Developer release workflow:
#   1. make release              — builds binaries, extension zips, AMO XPI
#   2. gh release create vX.Y.Z dist/* --title "..." --notes "..."
#   3. This workflow fires automatically, adds:
#        SHA256SUMS  SHA256SUMS.sig  SHA256SUMS.crt  SHA256SUMS.cosign.bundle
#
# Why CI downloads instead of rebuilds: `make release` calls `web-ext sign`
# which submits the XPI to AMO. AMO rejects duplicate submissions, so
# re-running `make release` in CI would fail before ever reaching the signing
# step. Separating build (developer) from signing (CI OIDC identity) is also
# the correct trust model — the signature proves *this workflow* produced the
# checksums, not any locally-run build.
#
# Users verify downloads with `cosign verify-blob` — see SECURITY.md.

on:
  release:
    types: [published]

permissions:
  contents: write   # gh release upload
  id-token: write   # cosign keyless OIDC

jobs:
  sign-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: sigstore/cosign-installer@v3

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          mkdir -p dist
          gh release download "$tag" \
            --repo "${{ github.repository }}" \
            --dir dist \
            --pattern "turboweb-mcp-by-ikari-*" \
            --pattern "firefox-updates.json"
          echo "--- downloaded assets ---"
          ls -lh dist/

      - name: Verify required artifacts are present
        run: |
          set -e
          missing=0
          for asset in \
            dist/turboweb-mcp-by-ikari-darwin-arm64 \
            dist/turboweb-mcp-by-ikari-linux-amd64 \
            dist/turboweb-mcp-by-ikari-windows-amd64.exe \
            dist/turboweb-mcp-by-ikari-windows-arm64.exe \
            dist/turboweb-mcp-by-ikari-extension-chrome.zip; do
            if [ ! -f "$asset" ]; then
              echo "::error::missing artifact: $asset"
              missing=1
            fi
          done
          if [ ! -f dist/firefox-updates.json ]; then
            echo "::error::dist/firefox-updates.json missing — was the XPI signed by AMO?"
            missing=1
          fi
          if ! ls dist/*.xpi >/dev/null 2>&1; then
            echo "::error::no signed .xpi in dist/ — AMO signing may have been skipped"
            missing=1
          fi
          [ "$missing" -eq 0 ] || exit 1
          echo "All required artifacts present."

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          # One canonical checksum file covering every release asset.
          # Users grab this + its signature to verify any asset at once.
          sha256sum turboweb-mcp-by-ikari-* firefox-updates.json > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Sign SHA256SUMS with cosign (keyless OIDC)
        working-directory: dist
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign-blob \
            --bundle SHA256SUMS.cosign.bundle \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.crt \
            SHA256SUMS

      - name: Upload signature files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          gh release upload "$tag" \
            dist/SHA256SUMS \
            dist/SHA256SUMS.sig \
            dist/SHA256SUMS.crt \
            dist/SHA256SUMS.cosign.bundle \
            --clobber
