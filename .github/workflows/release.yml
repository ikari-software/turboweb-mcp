name: release

# Fires when a release is published from a v* tag. Builds the cross-
# platform Go binaries + per-browser extension packages, AMO-signs the
# Firefox .xpi, generates firefox-updates.json (the Firefox auto-update
# manifest), signs every asset via Sigstore (keyless OIDC — no key
# material to leak), and uploads everything to the GitHub release.
#
# Firefox auto-update depends on this workflow shipping BOTH the signed
# .xpi and firefox-updates.json: the extension's update_url points at
# releases/latest/download/firefox-updates.json, which Firefox polls.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   WEB_EXT_API_KEY, WEB_EXT_API_SECRET
# from https://addons.mozilla.org/developers/addon/api/key/
#
# Users verify downloads with `cosign verify-blob` — see SECURITY.md.

on:
  release:
    types: [published]

permissions:
  contents: write   # gh release upload
  id-token: write   # cosign keyless OIDC

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - uses: sigstore/cosign-installer@v3

      - name: Install extension deps
        working-directory: extension
        run: npm ci

      # `make release` writes every artifact to dist/: cross-compiled Go
      # binaries, per-browser extension zips, the AMO-signed .xpi, and
      # firefox-updates.json. The WEB_EXT_* secrets drive `web-ext sign`.
      - name: Build release artifacts (binaries + extension + signed XPI)
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: make release

      # The Makefile's xpi/updates-json targets skip silently when the
      # AMO credentials are absent. A release without them breaks Firefox
      # auto-update — fail loudly here instead of shipping a broken one.
      - name: Verify Firefox auto-update artifacts
        run: |
          test -f dist/firefox-updates.json \
            || { echo "::error::dist/firefox-updates.json missing — set WEB_EXT_API_KEY / WEB_EXT_API_SECRET repo secrets"; exit 1; }
          ls dist/*.xpi >/dev/null 2>&1 \
            || { echo "::error::no signed .xpi in dist/ — AMO signing did not run"; exit 1; }

      - name: Inventory
        run: ls -lh dist/

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          # One canonical checksum file covering every release asset.
          # Users grab this + its signature to verify all assets at once.
          sha256sum turboweb-mcp-by-ikari-* firefox-updates.json > SHA256SUMS
          cat SHA256SUMS

      - name: Sign SHA256SUMS with cosign (keyless)
        working-directory: dist
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign-blob \
            --bundle SHA256SUMS.cosign.bundle \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.crt \
            SHA256SUMS

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          gh release upload "$tag" dist/* --clobber
