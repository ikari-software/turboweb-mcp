name: release

# Fires when a release is published from a v* tag. Downloads the pre-built
# artifacts the developer uploaded via `gh release create`, notarizes the
# macOS binary, generates an authoritative SHA256SUMS file, signs it with
# Sigstore keyless OIDC (cosign — no long-lived key material), and uploads
# everything back to the release.
#
# Developer release workflow:
#   1. make release              — builds binaries, extension zips, AMO XPI,
#                                  local SHA256SUMS (ad-hoc signed darwin ok)
#   2. gh release create vX.Y.Z  dist/turboweb-mcp-by-ikari-darwin-arm64 \
#                                 dist/turboweb-mcp-by-ikari-linux-amd64 \
#                                 dist/turboweb-mcp-by-ikari-windows-amd64.exe \
#                                 dist/turboweb-mcp-by-ikari-windows-arm64.exe \
#                                 dist/turboweb-mcp-by-ikari-extension-chrome.zip \
#                                 dist/turboweb-mcp-by-ikari-extension-firefox.zip \
#                                 dist/turboweb-mcp-by-ikari-extension-firefox-X.Y.Z.xpi \
#                                 dist/firefox-updates.json \
#                                 dist/SHA256SUMS \
#                                 --title "vX.Y.Z — …" --notes "…"
#   3. This workflow fires and:
#        a. Developer ID signs + notarizes darwin binary (Gatekeeper acceptance)
#        b. Replaces SHA256SUMS with an authoritative copy covering the
#           notarized binary hash
#        c. Adds SHA256SUMS.sig, SHA256SUMS.crt, SHA256SUMS.cosign.bundle
#
# Why CI downloads instead of rebuilds: `make release` calls `web-ext sign`
# which submits the XPI to AMO. AMO rejects duplicate submissions, so
# re-running `make release` in CI would fail before ever reaching the signing
# step. Separating build (developer) from signing (CI OIDC identity) is also
# the correct trust model — the signature proves *this workflow* produced the
# checksums, not any locally-run build.
#
# macOS notarization in CI (required so Gatekeeper accepts downloaded binaries):
#   Add these repository secrets (Settings → Secrets and variables → Actions):
#     APPLE_DEVELOPER_ID           "Developer ID Application: Name (TEAMID)"
#     APPLE_DEVELOPER_ID_CERT_P12  base64-encoded .p12 export of cert + private key
#     APPLE_DEVELOPER_ID_CERT_PASSWORD  password set when exporting the .p12
#     APPLE_ID                     Apple ID email
#     APP_SPECIFIC_PASSWORD        app-specific password from appleid.apple.com
#   APPLE_TEAM_ID is parsed from APPLE_DEVELOPER_ID automatically.
#   Without these secrets the workflow prints a skip notice and produces an
#   ad-hoc signed darwin binary — Gatekeeper rejects downloaded copies.
#
# workflow_dispatch lets you re-sign any release manually (e.g. if the
# release tag predated a workflow fix). The workflow always uses the file
# from the default branch, so dispatch picks up the latest fixes.
#
# Users verify downloads with `cosign verify-blob` — see SECURITY.md.

on:
  release:
    types: [published]
  # Manual re-run: useful when the release tag predates a workflow fix, or
  # to sign a release that was published before this workflow existed.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sign (e.g. v1.8.5)"
        required: true

permissions:
  contents: write   # gh release upload
  id-token: write   # cosign keyless OIDC

jobs:
  notarize-and-sign:
    runs-on: macos-latest
    # RELEASE_TAG resolves to the published release tag, or the manually-
    # supplied input when triggered via workflow_dispatch.
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: sigstore/cosign-installer@v3

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --dir dist \
            --pattern "turboweb-mcp-by-ikari-darwin-arm64" \
            --pattern "turboweb-mcp-by-ikari-linux-amd64" \
            --pattern "turboweb-mcp-by-ikari-windows-amd64.exe" \
            --pattern "turboweb-mcp-by-ikari-windows-arm64.exe" \
            --pattern "turboweb-mcp-by-ikari-extension-chrome.zip" \
            --pattern "turboweb-mcp-by-ikari-extension-firefox-${version}.xpi" \
            --pattern "firefox-updates.json"
          echo "--- downloaded assets ---"
          ls -lh dist/

      - name: Verify required artifacts are present
        run: |
          set -e
          version="${RELEASE_TAG#v}"
          missing=0
          for asset in \
            dist/turboweb-mcp-by-ikari-darwin-arm64 \
            dist/turboweb-mcp-by-ikari-linux-amd64 \
            dist/turboweb-mcp-by-ikari-windows-amd64.exe \
            dist/turboweb-mcp-by-ikari-windows-arm64.exe \
            dist/turboweb-mcp-by-ikari-extension-chrome.zip \
            "dist/turboweb-mcp-by-ikari-extension-firefox-${version}.xpi" \
            dist/firefox-updates.json; do
            if [ ! -f "$asset" ]; then
              echo "::error::missing artifact: $asset"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "All required artifacts present."

      - name: Import certificate, sign, and notarize darwin binary
        # Import + sign must be in the same shell: security unlock-keychain
        # does not persist across steps (each step spawns a new shell).
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_DEVELOPER_ID_CERT_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          if [ -z "$APPLE_DEVELOPER_ID" ] || [ -z "$APPLE_DEVELOPER_ID_CERT_P12" ]; then
            echo "::warning::APPLE_DEVELOPER_ID or APPLE_DEVELOPER_ID_CERT_P12 not set — skipping notarization (Gatekeeper will reject downloaded binary)"
            exit 0
          fi

          # --- Import certificate (GitHub-recommended keychain pattern) ---
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KC_PASS=$(openssl rand -hex 16)
          echo "$APPLE_DEVELOPER_ID_CERT_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN_PATH"
          # -A: allow all applications to access the imported key (no GUI prompt).
          # -t cert -f pkcs12: explicit type/format flags required for reliability.
          security import "$CERT_PATH" \
            -P "$APPLE_DEVELOPER_ID_CERT_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"
          echo "Certificate imported. Available signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          # --- Sign ---
          # Extract team ID from the identity string: "... (TEAMID)"
          APPLE_TEAM_ID=$(echo "$APPLE_DEVELOPER_ID" | grep -oE '\([A-Z0-9]+\)$' | tr -d '()')
          echo "Signing dist/turboweb-mcp-by-ikari-darwin-arm64 with Developer ID …"
          codesign --sign "$APPLE_DEVELOPER_ID" \
            --options runtime --timestamp --force \
            dist/turboweb-mcp-by-ikari-darwin-arm64

          # --- Notarize ---
          echo "Submitting to Apple notarization service (may take ~1 min) …"
          tmpzip=$(mktemp /tmp/notarize-XXXXXX.zip)
          rm -f "$tmpzip"
          zip -j "$tmpzip" dist/turboweb-mcp-by-ikari-darwin-arm64
          xcrun notarytool submit "$tmpzip" \
            --apple-id "$APPLE_ID" \
            --password "$APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          rm -f "$tmpzip"
          echo "Notarization complete. Re-uploading notarized binary to release …"
          gh release upload "$RELEASE_TAG" \
            dist/turboweb-mcp-by-ikari-darwin-arm64 \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          version="${RELEASE_TAG#v}"
          # Use shasum (macOS) — sha256sum is Linux-only.
          shasum -a 256 \
            turboweb-mcp-by-ikari-darwin-arm64 \
            turboweb-mcp-by-ikari-linux-amd64 \
            turboweb-mcp-by-ikari-windows-amd64.exe \
            turboweb-mcp-by-ikari-windows-arm64.exe \
            turboweb-mcp-by-ikari-extension-chrome.zip \
            "turboweb-mcp-by-ikari-extension-firefox-${version}.xpi" \
            firefox-updates.json > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Sign SHA256SUMS with cosign (keyless OIDC)
        working-directory: dist
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign-blob \
            --bundle SHA256SUMS.cosign.bundle \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.crt \
            SHA256SUMS

      - name: Upload signature files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/SHA256SUMS \
            dist/SHA256SUMS.sig \
            dist/SHA256SUMS.crt \
            dist/SHA256SUMS.cosign.bundle \
            --repo "${{ github.repository }}" \
            --clobber
