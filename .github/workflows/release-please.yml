name: release-please

# Automated releases. On every push to master, release-please keeps a
# "chore(master): release X.Y.Z" PR up to date: it bumps VERSION (the single
# version source for the Go binary and the extension) and prepends a
# CHANGELOG.md entry built from conventional commit titles (feat:, fix:, ...).
#
# Merging that PR:
#   1. release-please creates the vX.Y.Z tag and a DRAFT GitHub release whose
#      body is the changelog entry. Draft = invisible to self_update and to
#      releases/latest, so nobody sees a release without binaries.
#   2. build: `make release` on macOS at the tag (cross-compiled binaries,
#      extension zips, AMO-signed XPI, firefox-updates.json) and uploads them.
#   3. sign: reuses release.yml to notarize the darwin binary and cosign-sign
#      SHA256SUMS. Same workflow file, so the cosign certificate identity users
#      verify against (SECURITY.md) is unchanged.
#   4. publish: flips the draft to published + latest.
#
# Tokens: PRs opened with the default GITHUB_TOKEN don't trigger CI, so the
# required checks never run on the release PR. Add a RELEASE_PLEASE_TOKEN
# secret (fine-grained PAT or GitHub App token with contents + pull-requests
# write) to get CI on release PRs. Without it the default token is used and
# the release PR must be merged with an admin bypass.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: VERSION file matches the release
        run: |
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [ "$file_version" != "$VERSION" ]; then
            echo "::error::VERSION is '$file_version' but release-please released '$VERSION'"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install extension deps (web-ext for XPI signing)
        working-directory: extension
        run: npm ci

      # Notarization is deliberately NOT done here (no APPLE_* env): the
      # Makefile falls back to ad-hoc signing, and release.yml notarizes the
      # uploaded binary in the sign job, exactly as for manual releases.
      - name: make release
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: make release

      - name: Upload assets to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          assets=(
            dist/turboweb-mcp-by-ikari-darwin-arm64
            dist/turboweb-mcp-by-ikari-linux-amd64
            dist/turboweb-mcp-by-ikari-windows-amd64.exe
            dist/turboweb-mcp-by-ikari-windows-arm64.exe
            dist/turboweb-mcp-by-ikari-extension-chrome.zip
            dist/turboweb-mcp-by-ikari-extension-firefox.zip
            "dist/turboweb-mcp-by-ikari-extension-firefox-${VERSION}.xpi"
            dist/firefox-updates.json
          )
          for a in "${assets[@]}"; do
            [ -f "$a" ] || { echo "::error::missing build output: $a"; exit 1; }
          done
          gh release upload "$TAG" "${assets[@]}" --repo "${{ github.repository }}" --clobber

  sign:
    needs: [release-please, build]
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  publish:
    needs: [release-please, sign]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ needs.release-please.outputs.tag_name }}" \
            --repo "${{ github.repository }}" \
            --draft=false --latest
