<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* ── Colour tokens ────────────────────────────────────────────────────
     All rules below reference these variables only — no raw hex colours.
     The light-mode block overrides every token; nothing else changes.  */
  :root {
    --bg-0:      #0d1117;   /* page / body background                   */
    --bg-1:      #161b22;   /* elevated surface — cards, inputs, hover  */
    --bg-2:      #010409;   /* sunken surface — log, client list        */
    --fg-0:      #c9d1d9;   /* primary text                             */
    --fg-1:      #8b949e;   /* secondary text                           */
    --fg-2:      #484f58;   /* muted / section labels                   */
    --fg-3:      #6e7681;   /* very muted                               */
    --border:    #21262d;
    --scrollbar: #30363d;
    --accent:    #58a6ff;   /* blue — links, spinners, actions          */
    --success:   #3fb950;   /* green — connected dot                    */
    --error:     #f85149;   /* red — disconnected, errors               */
    --warn:      #d29922;   /* amber — slow commands                    */
    --tag-bg:    #21262d;
    --tag-fg:    #8b949e;
    --claude-bg: #4f3a17;
    --claude-fg: #d29922;
    --ide-bg:    #1f3a4f;
    --ide-fg:    #58a6ff;
    /* Dynamic agent-hue chips — lightness values tuned per theme */
    --chip-bg-l: 18%;
    --chip-fg-l: 56%;
    --client-fg-l: 56%;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg-0:      #ffffff;
      --bg-1:      #f6f8fa;
      --bg-2:      #f6f8fa;
      --fg-0:      #1f2328;
      --fg-1:      #57606a;
      --fg-2:      #6e7781;
      --fg-3:      #8c959f;
      --border:    #d0d7de;
      --scrollbar: #afb8c1;
      --accent:    #0969da;
      --success:   #1a7f37;
      --error:     #cf222e;
      --warn:      #9a6700;
      --tag-bg:    #eaeef2;
      --tag-fg:    #57606a;
      --claude-bg: #fff8e6;
      --claude-fg: #9a6700;
      --ide-bg:    #ddf4ff;
      --ide-fg:    #0969da;
      /* In light mode lighten chip backgrounds and darken text */
      --chip-bg-l: 88%;
      --chip-fg-l: 32%;
      --client-fg-l: 38%;
    }
  }

  /* ── Reset & base ─────────────────────────────────────────────────── */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* color-scheme: light dark — tells Firefox/Zen to paint the popup frame
     to match the active theme, eliminating the white border in Zen dark mode. */
  html { background: var(--bg-0); color-scheme: light dark; }
  body {
    width: 460px;
    min-height: 480px;
    font-family: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;
    font-size: 11px;
    background: var(--bg-0);
    color: var(--fg-0);
    padding: 12px;
    overflow-x: hidden;
  }
  body.windowed {
    width: 100vw;
    min-height: 100vh;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  body.windowed .section.log-section { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  body.windowed .log { flex: 1; min-height: 0; max-height: none; }

  /* ── Header ───────────────────────────────────────────────────────── */
  .header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .bolt { font-size: 16px; }
  .header h1 { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.5px; }
  .header .ver { font-size: 9px; color: var(--fg-2); margin-left: auto; }
  /* Moved out of inline style so it inherits theme tokens */
  .popout-btn {
    margin-left: 6px;
    background: var(--bg-1);
    color: var(--fg-1);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 8px;
    font: 10px/1 inherit;
    cursor: pointer;
  }
  .popout-btn:hover { background: var(--border); color: var(--fg-0); }

  /* ── Status bar ───────────────────────────────────────────────────── */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 10px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--error); flex-shrink: 0; }
  .dot.on {
    background: var(--success);
    box-shadow: 0 0 6px color-mix(in srgb, var(--success) 40%, transparent);
  }
  .dot.on.pulse { animation: pulse 2s infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 4px  color-mix(in srgb, var(--success) 27%, transparent); }
    50%       { box-shadow: 0 0 10px color-mix(in srgb, var(--success) 67%, transparent); }
  }
  .status-text { flex: 1; min-width: 0; }
  .status-text .label { color: var(--fg-1); font-size: 10px; }
  .browsers-list { color: var(--accent); font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── Sections ─────────────────────────────────────────────────────── */
  .section { margin-bottom: 10px; }
  .section-head {
    font-size: 9px; text-transform: uppercase; letter-spacing: 1.5px;
    color: var(--fg-2); margin-bottom: 4px; padding: 0 2px;
    display: flex; justify-content: space-between; align-items: center;
  }

  /* ── Agent list ───────────────────────────────────────────────────── */
  .clients {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 0;
    max-height: 120px;
    overflow-y: auto;
  }
  .client {
    display: flex; align-items: center; gap: 6px;
    padding: 3px 8px;
    border-bottom: 1px solid var(--bg-0);
    color: hsl(var(--client-hue, 40), 78%, var(--client-fg-l));
  }
  .client:last-child { border-bottom: none; }
  .client .agent-icon { width: 14px; height: 14px; flex-shrink: 0; }
  .client .agent-name { flex: 1; color: inherit; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .client .agent-meta { color: var(--fg-2); font-size: 9px; }
  .client .agent-tag {
    background: var(--tag-bg); color: var(--tag-fg);
    padding: 1px 5px; border-radius: 8px;
    font-size: 8px; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .client .agent-tag.claude-code,
  .client .agent-tag.claude  { background: var(--claude-bg); color: var(--claude-fg); }
  .client .agent-tag.cursor,
  .client .agent-tag.vscode  { background: var(--ide-bg);    color: var(--ide-fg);    }
  .clients-empty { color: var(--fg-2); padding: 8px; text-align: center; font-style: italic; }

  /* ── Filter bar ───────────────────────────────────────────────────── */
  .filter-bar { display: flex; gap: 4px; margin-bottom: 4px; }
  .filter-bar input {
    flex: 1;
    background: var(--bg-1); color: var(--fg-0);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 4px 6px; font-family: inherit; font-size: 10px;
    outline: none;
  }
  .filter-bar input:focus { border-color: var(--accent); }
  .filter-bar button {
    background: var(--bg-1); color: var(--fg-1);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 4px 8px; font-size: 10px; cursor: pointer;
    font-family: inherit;
  }
  .filter-bar button:hover { background: var(--border); color: var(--fg-0); }

  /* ── Activity log ─────────────────────────────────────────────────── */
  .log {
    max-height: 480px;
    overflow-y: auto;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 0;
  }
  .log::-webkit-scrollbar { width: 4px; }
  .log::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 2px; }

  .entry {
    border-bottom: 1px solid var(--bg-0);
    transition: background 0.15s;
    cursor: pointer;
  }
  .entry:hover { background: var(--bg-1); }
  /* Semi-transparent bg-1 tint for in-flight commands */
  .entry.running { background: color-mix(in srgb, var(--bg-1) 53%, transparent); }
  .entry-row {
    display: flex;
    align-items: center;
    padding: 3px 8px;
    gap: 6px;
  }
  .entry .time   { color: var(--fg-2); width: 55px; flex-shrink: 0; }
  .entry .action { color: var(--accent); font-weight: 500; flex-shrink: 0; max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry .action.err { color: var(--error); }
  .entry .intent { color: var(--fg-0); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-style: italic; }
  .entry .intent.muted { color: var(--fg-3); font-style: normal; }
  .entry .dur          { color: var(--fg-1); text-align: right; width: 50px; flex-shrink: 0; }
  .entry .dur.fast     { color: var(--success); }
  .entry .dur.slow     { color: var(--warn); }
  .entry .dur.err      { color: var(--error); }
  .entry .spinner {
    width: 10px; height: 10px;
    border: 1.5px solid var(--accent);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .entry .client-chip {
    background: hsl(var(--client-hue, 40), 28%, var(--chip-bg-l));
    color:      hsl(var(--client-hue, 40), 78%, var(--chip-fg-l));
    padding: 1px 4px; border-radius: 6px;
    font-size: 8px; flex-shrink: 0;
    max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .entry-detail {
    padding: 4px 8px 8px 70px;
    color: var(--fg-1); font-size: 10px;
    background: var(--bg-0);
    border-top: 1px dashed var(--border);
    display: none;
    word-break: break-all;
  }
  .entry.expanded .entry-detail { display: block; }
  .entry-detail .row { margin-bottom: 4px; }
  .entry-detail .key { color: var(--fg-3); text-transform: uppercase; font-size: 8px; letter-spacing: 1px; }
  .entry-detail pre {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 4px 6px;
    margin-top: 2px;
    color: var(--fg-0); font-size: 10px;
    white-space: pre-wrap; word-break: break-word;
    max-height: 120px; overflow-y: auto;
  }

  /* ── Stats row ────────────────────────────────────────────────────── */
  .stats-row { display: flex; gap: 6px; }
  .stat {
    flex: 1;
    text-align: center;
    padding: 6px 4px;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 4px;
  }
  .stat .val      { font-size: 15px; font-weight: 700; color: var(--accent); }
  .stat .val.warn { color: var(--error); }
  .stat .lbl      { font-size: 8px; color: var(--fg-2); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

  .empty { color: var(--fg-2); text-align: center; padding: 20px; font-style: italic; }
</style>
</head>
<body>
  <div class="header">
    <span class="bolt">&#x26A1;</span>
    <h1>TURBOWEB</h1>
    <span class="ver" id="ver">MCP</span>
    <button id="popout" title="Open in resizable window" class="popout-btn">
      ⤢ Pop out
    </button>
  </div>

  <div class="status-bar">
    <div class="dot" id="dot"></div>
    <div class="status-text">
      <div id="status-label" class="label">Disconnected</div>
      <div id="browsers" class="browsers-list"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-head">
      <span>Connected agents</span>
      <span id="clients-count">0</span>
    </div>
    <div class="clients" id="clients">
      <div class="clients-empty" id="clients-empty">No agents connected</div>
    </div>
  </div>

  <div class="section log-section">
    <div class="section-head">
      <span>Activity</span>
      <span id="cmd-rate"></span>
    </div>
    <div class="filter-bar">
      <input id="filter" type="text" placeholder="Filter by action, intent, client…" />
      <button id="clear-log" title="Clear activity">Clear</button>
    </div>
    <div class="log" id="log">
      <div class="empty" id="empty-msg">Waiting for commands...</div>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat">
      <div class="val" id="s-cmds">0</div>
      <div class="lbl">Commands</div>
    </div>
    <div class="stat">
      <div class="val" id="s-errs">0</div>
      <div class="lbl">Errors</div>
    </div>
    <div class="stat">
      <div class="val" id="s-avg">-</div>
      <div class="lbl">Avg ms</div>
    </div>
    <div class="stat">
      <div class="val" id="s-up">0s</div>
      <div class="lbl">Uptime</div>
    </div>
  </div>

<script src="popup.js"></script>
</body>
</html>
